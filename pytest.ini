[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    allow_swallowed_failure(path, ...): this test means to reach the named swallow-and-continue except block(s); see tests/swallow_tripwire.py
    replay_baseline: compares a replayed plan with simulations/plan-baseline; see scripts/replay_plan_baseline.py
