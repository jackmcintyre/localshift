[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localshift"
version = "0.1.0"
description = "LocalShift battery automation for Home Assistant"
requires-python = ">=3.13.2"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "homeassistant",
]

[tool.setuptools.packages.find]
include = ["custom_components.localshift*"]

[tool.ruff]
line-length = 88
target-version = "py313"
preview = true
# vulture_whitelist.py is vulture input, not code: a list of bare attribute
# expressions that ruff reads as F821/B018 on every line (issue #1073).
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = [
  "F",
  "I",
  "B",
  "UP",
  "PLR1702",
  "C901",
]



[tool.vulture]
# Dead-code ratchet (issue #986). The blocking check is
# `uv run python scripts/dead_code_gate.py`, which reads this table; see
# docs/DEVELOPER_GUIDE.md, "Dead-code ratchet". A bare `uv run vulture` uses
# the same settings and prints roughly dead_code_baseline.txt.
min_confidence = 60
paths = ["custom_components/localshift", "vulture_whitelist.py"]
exclude = ["tests/"]
# Globs are for naming conventions Home Assistant itself defines, nothing else:
# it reads any `_attr_<property>` off an entity and dispatches config-flow
# steps to `async_step_<step_id>`. Every other live-but-dynamic name goes in
# vulture_whitelist.py with the site that reaches it.
ignore_names = ["_attr_*", "async_step_*"]

[tool.deptry]
known_first_party = ["custom_components.localshift"]

[tool.interrogate]
fail-under = 50
exclude = ["tests/"]
ignore-init-module = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["custom_components/localshift"]
exclude = [
  "**/__pycache__",
  ".git",
  ".claude",
]
reportMissingImports = false
reportMissingModuleSource = false
reportGeneralTypeIssues = false
reportCallIssue = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "except Exception:",
  "class .*Stub.*:",
  "Stub for .* when homeassistant",
]

[dependency-groups]
dev = [
    "homeassistant>=2026.2.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "bandit>=1.9.4",
    "safety>=3.7.0",
    "vulture>=2.14",
    "ruff>=0.15.2",
    "deptry>=0.20.0",
    "interrogate>=1.7.0",
]
