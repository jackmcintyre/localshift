name: Lint

on:
  pull_request:
    branches: [main, test]
    paths-ignore:
      - "**.md"
      - "docs/**"

# A new push to a PR supersedes the run still in flight for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff lint
        run: uv run ruff check custom_components/localshift

      # Issue #1131: a test class or function defined twice in one module
      # shadows the first definition, so pytest silently never collects it.
      # Only F811 is enforced on tests; the full rule set is not (yet) clean there.
      - name: Run ruff shadowed-test check
        run: uv run ruff check tests --select F811

      - name: Run ruff format check
        run: uv run ruff format --check custom_components/localshift

      # Dead-code ratchet (issue #986). BLOCKING, and it fails both ways: on
      # an unused symbol that is not in dead_code_baseline.txt, and on a
      # baseline entry that is no longer found. The failure text says which
      # file to edit; see docs/DEVELOPER_GUIDE.md, "Dead-code ratchet".
      - name: Dead-code ratchet
        run: uv run python scripts/dead_code_gate.py

      - name: Run bandit
        run: uv run bandit -r custom_components/localshift -x tests/

      - name: Run interrogate
        run: uv run interrogate custom_components/localshift --fail-under 50

      - name: Run deptry
        run: uv run deptry custom_components/localshift --ignore DEP002,DEP003 || true

  pyright:
    runs-on: ubuntu-latest
    continue-on-error: true  # Pre-existing type issues - non-blocking

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run pyright
        run: npx pyright custom_components/localshift
