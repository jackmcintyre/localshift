# =============================================================================
# LocalShift Battery Automation Dashboard
# =============================================================================
#
# Three views:
#   - Overview: mission control — status, live flows, the plan timeline, peak
#     readiness, money, the decision feed, and quick controls.
#   - Settings: all LocalShift controls, grouped by how often you touch them.
#   - Debug:    full state dump, decision log, and slot-by-slot optimizer plan.
#
# Dashboard primarily uses entities from the localshift custom component.
# Also references entities from two other integrations — ADJUST THESE TO
# MATCH YOUR SETUP (search & replace):
#   - my_home_*  entities from the Tesla Powerwall integration (Teslemetry)
#   - 100h_*     entities from the Amber Electric YAML package
#
# No HACS cards required. Everything here is a native Home Assistant card
# except one: custom:localshift-plan-timeline. Core HA can only plot the past
# (history-graph, statistics-graph), so the forward plan has no native
# equivalent — that card, and only that card, ships with the integration at
# custom_components/localshift/www/localshift-cards.js.
# Install it once:
#   1. Copy custom_components/localshift/www/localshift-cards.js
#      to <ha-config>/www/localshift/localshift-cards.js
#   2. Settings -> Dashboards -> Resources -> Add resource:
#        URL:  /local/localshift/localshift-cards.js?v=2.0.0
#        Type: JavaScript module
#      (bump the ?v= query on update, or browsers keep the old module cached)
#
# Add to configuration.yaml:
#   lovelace:
#     mode: storage
#     dashboards:
#       local-shift:  # URL path requires a hyphen
#         mode: yaml
#         filename: custom_components/localshift/dashboard.yaml
#         title: LocalShift
#         icon: mdi:battery-sync
#
# =============================================================================

title: LocalShift
views:
  # ===========================================================================
  # VIEW 1: OVERVIEW — mission control
  # Built from native cards wherever Home Assistant has one. The single custom
  # element left is the plan timeline: core HA plots the past (history-graph,
  # statistics-graph) and has nothing that plots a forward series, and the
  # forward plan is the whole point of this integration.
  # ===========================================================================
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    type: sections
    max_columns: 2
    sections:
      # --- What it is doing, and why ---------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            icon: mdi:home-battery
            badges:
              - type: entity
                entity: switch.localshift_automation_enabled
                show_state: true
              - type: entity
                entity: switch.localshift_dry_run
                show_state: true
              - type: entity
                entity: binary_sensor.localshift_tesla_override_active
                show_state: true
              - type: entity
                entity: sensor.localshift_integration_status
                show_state: true
              - type: entity
                entity: sensor.localshift_optimizer_summary
                show_state: true

          - type: markdown
            content: |
              {% set mode = states('select.localshift_battery_mode') %}
              {% set heads = {
                   'self_consumption': 'Running on sun & stored energy',
                   'grid_charging': 'Charging on cheap power',
                   'boost_charging': 'Boost charging before the peak',
                   'spike_discharge': 'Selling into the spike',
                   'proactive_export': 'Exporting ahead of negative prices',
                   'automatic': 'Optimizer in control' } %}
              {% if not is_state('switch.localshift_automation_enabled', 'on') %}
              ## Manual control
              Automation is off — LocalShift is not steering the battery.
              {% else %}
              ## {{ heads.get(mode, 'Optimizer in control') }}
              {{ state_attr('sensor.localshift_decision_log', 'reason') or '' }}
              {% endif %}

              {% set c = state_attr('sensor.localshift_optimizer_plan_detailed', 'computed_at') %}
              {% set age = ((now() - as_datetime(c)).total_seconds() / 60) if c else 0 %}
              {% if age > 30 %}
              ⚠️ Plan is {{ age | round(0) }} minutes old.
              {% endif %}

      # --- Live flows -------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live flows
            heading_style: subtitle
            icon: mdi:transmission-tower

          - type: tile
            entity: sensor.my_home_solar_power
            name: Solar
            icon: mdi:solar-power

          - type: tile
            entity: sensor.my_home_load_power
            name: Home
            icon: mdi:home-lightning-bolt

          - type: tile
            entity: sensor.my_home_grid_power
            name: Grid
            icon: mdi:transmission-tower
            state_content:
              - state
              - last_changed

          - type: tile
            entity: sensor.my_home_battery_power
            name: Battery
            icon: mdi:battery-charging

          - type: tile
            entity: sensor.my_home_percentage_charged
            name: State of charge
            icon: mdi:battery

          - type: tile
            entity: sensor.100h_general_price
            name: Buy now
            icon: mdi:cash-minus

          - type: tile
            entity: sensor.100h_feed_in_price
            name: Sell now
            icon: mdi:cash-plus

      # --- The plan (the one custom card) ----------------------------------
      - type: grid
        column_span: 2
        cards:
          # Entity ids and the peak window are configurable; defaults live in
          # www/localshift-cards.js. Example:
          #   entities:
          #     soc: sensor.my_home_percentage_charged
          #   dw_start: "15:00"
          #   dw_end: "21:00"
          - type: custom:localshift-plan-timeline
            grid_options:
              columns: full

      # --- Peak readiness ---------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Peak window
            heading_style: subtitle
            icon: mdi:chart-bell-curve

          - type: markdown
            content: |
              {%- set s = 'sensor.localshift_optimizer_summary' %}
              {%- set target = states('number.localshift_battery_target') | float(95) %}
              {%- set entry = state_attr(s, 'dw_entry_soc_pct') %}
              {%- set actual = state_attr(s, 'dw_entry_actual_soc_pct') %}
              {%- set short = state_attr(s, 'terminal_shortfall_pct') | float(0) %}
              {%- if is_state('binary_sensor.localshift_demand_window', 'on') %}
              **In the peak window now.**
              {% if actual is not none %}Entered at {{ actual | round(1) }}% against a {{ target | round(0) }}% target — {{ (target - actual) | round(1) }}pp {{ 'short' if actual < target else 'over' }}.{% endif %}
              {%- elif entry is not none %}
              **Planned entry:** {{ entry | round(0) }}% of a {{ target | round(0) }}% target — {% if entry < target %}**{{ (target - entry) | round(0) }}pp short**{% else %}on target ✓{% endif %}
              {%- else %}
              **Planned entry:** on track — solar alone is forecast to reach the {{ target | round(0) }}% target, so the planner computed no pre-charge requirement.
              {%- endif %}

              Terminal shortfall (measured at the *end* of the window, not at entry): **{{ short | round(1) }}%**

              {% set d = state_attr('sensor.localshift_optimizer_plan_detailed', 'decisions') or [] -%}
              {%- set labels = {
                   'charge_grid_normal': 'Charge',
                   'charge_grid_boost': 'Boost',
                   'proactive_export': 'Export',
                   'spike_discharge': 'Sell',
                   'hold': 'Hold' } -%}
              {%- set cur = d[0].action if d | length > 0 else none -%}
              {%- set ns = namespace(next=none) -%}
              {%- for slot in d if ns.next is none and slot.action != cur -%}
              {%- set ns.next = slot -%}
              {%- endfor -%}
              {%- if ns.next is not none -%}
              {%- set at = as_datetime(ns.next.timestamp_iso) | as_local -%}
              **Next move:** {{ labels.get(ns.next.action, ns.next.action) }} at {{ at.strftime('%H:%M') }}{{ '' if at.date() == now().date() else ' ' ~ at.strftime('%a') }}
              {%- else -%}
              **Next move:** none planned in this horizon.
              {%- endif %}

              {% if state_attr(s, 'precharge_backstop_active') -%}
              🟠 Runway backstop armed ({{ state_attr(s, 'precharge_runway_slack_min') }} min slack).
              {%- endif %}

      # --- Money ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Money
            heading_style: subtitle
            icon: mdi:cash-multiple

          - type: tile
            entity: sensor.localshift_cost_electricity_net
            name: Net today

          - type: markdown
            content: |
              {%- set c = 'sensor.localshift_cost_electricity_net' %}
              imports **${{ '%.2f' | format(state_attr(c, 'grid_import_cost') | float(0)) }}**
              · exports **${{ '%.2f' | format(state_attr(c, 'grid_export_revenue') | float(0)) }}**
              · rest of plan **${{ '%.2f' | format(states('sensor.localshift_optimizer_plan_grid') | float(0)) }}**

          # Native replacement for the old hand-rolled SVG bar chart — the cost
          # sensor carries state_class: total, so it is a long-term statistic.
          - type: statistics-graph
            title: Net cost, last 7 days
            entities:
              - entity: sensor.localshift_cost_electricity_net
                name: Net
            stat_types:
              - state
            period: day
            chart_type: bar
            days_to_show: 7

      # --- Why it did that --------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Why it did that
            heading_style: subtitle
            icon: mdi:comment-question-outline

          - type: markdown
            content: |
              {%- set h = state_attr('sensor.localshift_decision_log', 'history') or [] -%}
              {%- set ns = namespace(rows=[], last='') -%}
              {%- for e in h | reverse -%}
              {%- if e.reason != ns.last and ns.rows | length < 8 -%}
              {%- set ns.rows = ns.rows + [e] -%}
              {%- set ns.last = e.reason -%}
              {%- endif -%}
              {%- endfor -%}
              {%- if ns.rows | length == 0 -%}
              No decisions logged yet.
              {%- else -%}
              {%- for e in ns.rows %}
              - **{{ e.reason }}** — {{ (as_datetime(e.timestamp) | as_local).strftime('%H:%M') }}, SOC {{ e.soc }}%
              {%- endfor -%}
              {%- endif %}

      # --- Quick controls ---------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Quick Controls
            heading_style: subtitle
            icon: mdi:tune-variant

          - type: tile
            entity: select.localshift_battery_mode
            name: Battery Mode
            features:
              - type: select-options

          - type: tile
            entity: number.localshift_battery_target
            name: Peak Target
            features:
              - type: numeric-input
                style: slider

          - type: button
            name: Update Forecast
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.localshift_update_forecast
            icon_height: 40px

  # ===========================================================================
  # VIEW 2: SETTINGS
  # Grouped by how often you touch them: master switches first, behaviour
  # rules next, fine-tuning numbers last. Tuning defaults are sensible —
  # most installs never need to change them.
  # ===========================================================================
  - title: Settings
    path: settings
    icon: mdi:tune
    type: sections
    max_columns: 2
    sections:
      # --- Master Switches -------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Master Switches
            heading_style: title

          - type: tile
            entity: switch.localshift_automation_enabled
            name: Automation
            icon: mdi:power

          - type: tile
            entity: switch.localshift_dry_run
            name: Dry Run
            icon: mdi:test-tube
            color: amber

          - type: tile
            entity: switch.localshift_notifications_enabled
            name: Notifications
            icon: mdi:bell-outline

          - type: markdown
            content: >
              **Automation** is the master switch — off means LocalShift never
              touches the battery. **Dry run** keeps automation logic running
              but only logs what it *would* do.

      # --- Mode & Manual Actions --------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Mode & Manual Actions
            heading_style: title

          - type: tile
            entity: select.localshift_battery_mode
            name: Battery Mode
            features:
              - type: select-options

          - type: button
            name: Update Forecast
            icon: mdi:refresh
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.localshift_update_forecast
            icon_height: 40px

          - type: markdown
            content: >
              Setting a mode by hand is temporary — automation will take over
              again on its next cycle (turn **Automation** off first for a
              lasting override). *automatic* = let the optimizer decide ·
              *self_consumption* = solar + battery run the house ·
              *grid_charging* = charge at 3.3 kW · *boost_charging* = charge
              at 5 kW · *spike_discharge* = sell to the grid ·
              *proactive_export* = export ahead of negative feed-in prices.

      # --- Targets ----------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Targets
            heading_style: title

          - type: tile
            entity: number.localshift_battery_target
            name: Demand Window Target
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: number.localshift_minimum_target_soc
            name: Minimum SOC
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: select.localshift_optimization_mode
            name: Optimization Mode
            features:
              - type: select-options

          - type: markdown
            content: >
              **Demand window target** is the SOC the battery should reach
              before the evening demand window. **Minimum SOC** is the floor
              the battery won't discharge below. **Optimization mode:**
              *self_consumption* favours covering the house; *arbitrage* also
              trades on price spreads.

      # --- Charging Rules -----------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Charging Rules
            heading_style: title

          - type: tile
            entity: switch.localshift_demand_window_block
            name: Block Grid Charging in Demand Window
            color: orange

          - type: tile
            entity: switch.localshift_allow_dw_entry_under_target
            name: Allow DW Entry Under Target
            color: green

          - type: tile
            entity: switch.localshift_spike_discharge_enabled
            name: Spike Discharge

          - type: tile
            entity: switch.localshift_spike_discharge_conservative
            name: Conservative Spike Discharge

          - type: tile
            entity: switch.localshift_stale_solar_conservative
            name: Stale Solar Conservative

          - type: tile
            entity: number.localshift_charge_taper_start
            name: Charge Taper Start
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: number.localshift_charge_taper_min_factor
            name: Charge Taper Min Factor

          - type: markdown
            content: >
              **Allow DW entry under target** lets the demand window start
              below target when solar is forecast to close the gap.
              **Conservative spike discharge** keeps a dynamic reserve while
              selling. **Stale solar conservative** distrusts the solar
              forecast when Solcast data is stale or missing. **Charge taper**
              ramps charge power down as SOC approaches full — *start* is the
              SOC where tapering begins, *min factor* the floor it tapers to.

      # --- Price & Optimizer Tuning (advanced) ---------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Price & Optimizer Tuning
            heading_style: title

          - type: markdown
            content: >
              ⚙️ *Advanced — the defaults are sensible. Change one thing at a
              time and watch the plan for a day.*

          - type: tile
            entity: number.localshift_cheap_price_percentile
            name: Cheap Price Percentile
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: number.localshift_max_pre_charge_price
            name: Max Pre-charge Price

          - type: tile
            entity: number.localshift_min_cycle_saving
            name: Min Cycle Saving

          - type: tile
            entity: number.localshift_min_hold_saving
            name: Min Hold Saving

          - type: tile
            entity: number.localshift_switching_penalty
            name: Switching Penalty

          - type: tile
            entity: number.localshift_switching_penalty_per_kwh
            name: Switching Penalty Per kWh

          - type: tile
            entity: number.localshift_target_shortfall_penalty
            name: Shortfall Penalty

          - type: tile
            entity: number.localshift_pre_charge_runway_margin
            name: Pre-charge Runway Margin
            features:
              - type: numeric-input
                style: slider

          - type: tile
            entity: number.localshift_stale_solar_confidence_ceiling
            name: Stale Solar Confidence Ceiling

          - type: markdown
            content: |
              Resulting thresholds right now:
              **Charge when below:** ${{ states('sensor.localshift_price_cheap_effective') }}/kWh · **Stop charging at:** ${{ states('sensor.localshift_price_cheap_charge_stop') }}/kWh

              **Cheap price percentile** sets where in the price forecast
              "cheap" begins. **Min cycle saving** is the $/kWh margin needed
              to justify wearing the battery; **min hold saving** is the same
              test applied to holding charge rather than cycling it.
              **Switching penalty** damps rapid mode flapping — the flat term
              per change, the *per kWh* term scaling with how much energy the
              change moves. **Shortfall penalty** controls how hard the
              optimizer pushes to hit the demand window target. **Pre-charge
              runway margin** is the safety net: minutes of slack before the
              demand window at which pre-charge is armed even when solar looks
              sufficient. Set it to 0 to disarm the backstop entirely.

      # --- Decision Telemetry ----------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Decision Telemetry
            heading_style: title

          - type: tile
            entity: sensor.localshift_learning_decision_history
            name: Decisions Recorded
            icon: mdi:history

          - type: button
            name: Reset Decision Telemetry
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.localshift_reset_learning_data
              confirmation:
                text: This discards every recorded decision and its outcome. Continue?
            icon_height: 40px

          - type: markdown
            content: >
              LocalShift records each mode decision and its measured outcome.
              These are observations only — nothing reads them back to change
              behaviour. The parameter-learning layer that once did was retired
              after it produced no measurable gain.

      # --- Powerwall (live system) --------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Powerwall
            heading_style: title

          - type: tile
            entity: select.my_home_operation_mode
            name: Operation Mode

          - type: tile
            entity: number.my_home_backup_reserve
            name: Backup Reserve
            icon: mdi:battery-lock

          - type: tile
            entity: sensor.my_home_battery_power
            name: Battery Power
            icon: mdi:battery-charging

          - type: tile
            entity: sensor.my_home_grid_power
            name: Grid Power
            icon: mdi:transmission-tower

          - type: tile
            entity: sensor.my_home_solar_power
            name: Solar Power
            icon: mdi:solar-power

          - type: markdown
            content: >
              ⚠️ LocalShift drives *operation mode* and *backup reserve* when
              automation is on — manual changes here will be overwritten on
              the next cycle.

      # --- System Health -------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: System Health
            heading_style: title

          - type: tile
            entity: sensor.localshift_integration_status
            name: Integration
            icon: mdi:heart-pulse

          - type: tile
            entity: sensor.localshift_automation_ready
            name: Automation Ready
            icon: mdi:check-circle-outline

          - type: tile
            entity: sensor.localshift_forecast_status
            name: Forecast Status
            icon: mdi:crystal-ball

          - type: tile
            entity: sensor.localshift_entity_health
            name: Entity Health
            icon: mdi:stethoscope

          - type: markdown
            content: |
              {% set errors = state_attr('sensor.localshift_entity_health', 'errors') | default([]) %}
              {% set warnings = state_attr('sensor.localshift_entity_health', 'warnings') | default([]) %}
              {% if errors | length == 0 and warnings | length == 0 %}
              ✅ No entity errors or warnings.
              {% else %}
              {% for error in errors %}
              - 🔴 {{ error }}
              {% endfor %}
              {% for warning in warnings %}
              - 🟡 {{ warning }}
              {% endfor %}
              {% endif %}

  # ===========================================================================
  # VIEW 3: DEBUG (Power User Diagnostics)
  # ===========================================================================
  - title: Debug
    path: debug
    icon: mdi:bug
    type: sections
    max_columns: 1
    sections:
      # --- Debug State Summary ---
      - type: grid
        cards:
          - type: heading
            heading: Debug State Summary
            heading_style: title

          - type: markdown
            content: >
              ```
              === DEBUG STATE SUMMARY ===

              Time: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}

              === CURRENT STATE ===

              Mode: {{ states('select.localshift_battery_mode') }}

              Optimization Mode: {{ states('select.localshift_optimization_mode') }}

              SOC: {{ states('sensor.my_home_percentage_charged') }}%

              Battery Power: {{ states('sensor.my_home_battery_power') }} kW

              Grid Power: {{ states('sensor.my_home_grid_power') }} kW

              Solar Power: {{ states('sensor.my_home_solar_power') }} kW

              Load Power: {{ states('sensor.my_home_load_power') }} kW

              Buy Price: ${{ states('sensor.100h_general_price') }}/kWh

              Sell Price: ${{ states('sensor.100h_feed_in_price') }}/kWh

              Price Spike: {{ states('binary_sensor.100h_price_spike') }}

              Demand Window: {{ states('binary_sensor.localshift_demand_window') }}

              === ENTITY HEALTH ===

              Integration Status: {{ states('sensor.localshift_integration_status') }}

              Entity Health: {{ states('sensor.localshift_entity_health') }}

              Automation Ready: {{ states('sensor.localshift_automation_ready') }}

              Forecast Status: {{ states('sensor.localshift_forecast_status') }}

              {% set entities = state_attr('sensor.localshift_entity_health', 'entities') | default({}) %}
              {% set ls_entities = state_attr('sensor.localshift_entity_health', 'localshift_entities') | default({}) %}
              {% set all_entities = dict((entities.items() | list) + (ls_entities.items() | list)) %}
              {% set errors = state_attr('sensor.localshift_entity_health', 'errors') | default([]) %}
              {% set warnings = state_attr('sensor.localshift_entity_health', 'warnings') | default([]) %}

              Errors: {{ errors | length }}
              {% for error in errors %}
                - {{ error }}
              {% endfor %}

              Warnings: {{ warnings | length }}
              {% for warning in warnings %}
                - {{ warning }}
              {% endfor %}

              Unhealthy Entities:
              {% for name, info in all_entities.items() %}
              {%- if info.status != 'ok' %}
                - {{ info.entity_id }}: {{ info.status }}{% if info.error_message %} ({{ info.error_message }}){% endif %}
              {%- endif %}
              {%- endfor %}

              === INTERNAL STATE FLAGS ===

              Manual Override: {{ states('switch.localshift_automation_enabled') == 'off' }}

              Forecast Spike Within Window: {{ states('binary_sensor.localshift_price_spike_coming') }}

              Max Forecast Price: ${{ state_attr('binary_sensor.localshift_price_spike_coming', 'max_forecast_price') | default(0) }}/kWh

              Max Buy Forecast Price: ${{ state_attr('binary_sensor.localshift_price_spike_coming', 'max_buy_forecast_price') | default(0) }}/kWh

              Discharge Forced: {{ states('binary_sensor.localshift_discharge_forced') == 'on' }}

              Charge Forced: {{ states('binary_sensor.localshift_charge_forced') == 'on' }}

              Boost Charge Active: {{ states('select.localshift_battery_mode') == 'boost_charging' }}

              Solar Can Reach Target: {{ states('binary_sensor.localshift_solar_can_reach_target') }}

              Boost Charge Needed: {{ states('binary_sensor.localshift_charge_boost_needed') }}

              Price Expensive Coming: {{ states('binary_sensor.localshift_price_expensive_coming') }}

              Excess Solar Available: {{ states('binary_sensor.localshift_excess_solar_available') }}

              Excess Solar Forecast: {{ states('sensor.localshift_excess_solar') }} kWh

              Load Shift Signal: {{ states('sensor.localshift_load_shift_signal') }}

              Tesla Override Active: {{ states('binary_sensor.localshift_tesla_override_active') }}

              Amber Demand Window: {{ states('binary_sensor.localshift_amber_demand_window') }}

              === DEBUG: MODE DECISION (from forecast_diagnostics) ===

              Mode Source: {{ state_attr('sensor.localshift_forecast_diagnostics', 'debug_mode_source') | default('unknown') }}

              Forecast Slot Found: {{ state_attr('sensor.localshift_forecast_diagnostics', 'debug_forecast_slot_found') | default(false) }}

              Forecast Slot Time: {{ state_attr('sensor.localshift_forecast_diagnostics', 'debug_forecast_slot_time') | default('-') }}

              First Forecast Slot: {{ state_attr('sensor.localshift_forecast_diagnostics', 'debug_first_forecast_slot_time') | default('-') }}

              Time Gap: {{ state_attr('sensor.localshift_forecast_diagnostics', 'debug_time_gap_seconds') | default(0) }}s

              Dry Run: {{ states('switch.localshift_dry_run') == 'on' }}

              === CONFIGURATION & THRESHOLDS ===

              Cheap Price Percentile: {{ states('number.localshift_cheap_price_percentile') }}%

